name: 🚂 Build Articulated Trains

# Self-contained: this single file carries the whole mod project (packed below),
# so it is the only file you need in an empty GitHub repository.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 🔨 Compile mod jar
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 📂 Unpack mod project (only if sources are not in the repo)
