          package com.example.railworks;

          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.blaze3d.vertex.VertexConsumer;
          import com.simibubi.create.AllBlocks;
          import com.simibubi.create.content.kinetics.simpleRelays.ShaftBlock;
          import com.simibubi.create.content.trains.bogey.BogeyRenderer;

          import net.createmod.catnip.data.Iterate;
          import net.createmod.catnip.render.CachedBuffers;
          import net.createmod.catnip.render.SuperByteBuffer;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.RenderType;
          import net.minecraft.core.Direction;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.world.level.block.Blocks;

          public class BrassBogeyRenderer implements BogeyRenderer {
              @Override
              public void render(CompoundTag bogeyData, float wheelAngle, float partialTick, PoseStack poseStack,
                                 MultiBufferSource bufferSource, int light, int overlay, boolean inContraption) {
                  VertexConsumer buffer = bufferSource.getBuffer(RenderType.cutoutMipped());

                  SuperByteBuffer shaft = CachedBuffers.block(AllBlocks.SHAFT.getDefaultState()
                          .setValue(ShaftBlock.AXIS, Direction.Axis.Z));
                  for (int i : Iterate.zeroAndOne) {
                      shaft.translate(-.5f, .25f, i * -1)
                              .center()
                              .rotateZDegrees(wheelAngle)
                              .uncenter()
                              .light(light)
                              .overlay(overlay)
                              .renderInto(poseStack, buffer);
                  }

                  CachedBuffers.partial(RWPartialModels.BOGEY_FRAME, Blocks.AIR.defaultBlockState())
                          .scale(1 - 1 / 512f)
                          .light(light)
                          .overlay(overlay)
                          .renderInto(poseStack, buffer);

                  SuperByteBuffer wheels = CachedBuffers.partial(RWPartialModels.BOGEY_WHEELS, Blocks.AIR.defaultBlockState());
                  for (int side : Iterate.positiveAndNegative) {
                      wheels.translate(0, 12 / 16f, side)
                              .rotateXDegrees(wheelAngle)
                              .light(light)
                              .overlay(overlay)
                              .renderInto(poseStack, buffer);
                  }
              }
          }
