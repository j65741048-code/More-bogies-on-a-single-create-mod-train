      - name: 🧰 Install Gradle (only when the wrapper is missing)
        if: ${{ hashFiles('gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 🧱 Generate Gradle wrapper (only when missing)
        if: ${{ hashFiles('gradlew') == '' }}
        run: gradle wrapper --gradle-version 8.10.2

      - name: 🔑 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🛠️ Build with Gradle
        run: ./gradlew build --no-daemon --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: 📦 Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: 🚂-articulated-trains-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: 📝 Upload build log (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: 📝-build-log
          path: build.log
          if-no-files-found: ignore
